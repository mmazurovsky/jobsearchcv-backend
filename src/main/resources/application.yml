spring:
  application:
    name: jobsearchcv-backend
  data:
    mongodb:
      # Use the same MongoDB URI pattern that works in the other Spring app
      uri: mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}/${MONGO_DB}?tls=true&authSource=admin
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      use-big-decimal-for-floats: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
  mvc:
    async:
      request-timeout: 60000  # 60 seconds timeout for async requests


# Firebase configuration
firebase:
  enabled: ${FIREBASE_ENABLED:true}
  project-id: ${FIREBASE_PROJECT_ID:applyfirst-b9c69}
  credentials:
    # Option 1: Individual environment variables (recommended for deployment)
    private-key: ${FIREBASE_PRIVATE_KEY:}
    private-key-id: ${FIREBASE_PRIVATE_KEY_ID:}
    client-email: ${FIREBASE_CLIENT_EMAIL:}
    client-id: ${FIREBASE_CLIENT_ID:}
    # Option 2: File path (for local development)
    path: ${FIREBASE_CREDENTIALS_PATH:}
  storage:
    bucket: ${FIREBASE_STORAGE_BUCKET:applyfirst-b9c69.firebasestorage.app}
    retry:
      max-attempts: ${FIREBASE_STORAGE_MAX_RETRY_ATTEMPTS:3}
      delay-ms: ${FIREBASE_STORAGE_RETRY_DELAY_MS:1000}

sentry:
  dsn: ${SENTRY_DSN:}
  # Add data like request headers and IP for users,
  # see https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/ for more info
  send-default-pii: true
  # Set traces-sample-rate to 1.0 to capture 100% of transactions for tracing.
  # We recommend adjusting this value in production.
  traces-sample-rate: 1.0
  environment: ${SENTRY_ENVIRONMENT:development}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  config: classpath:logback-spring.xml
  level:
    root: ${LOG_LEVEL:INFO}
    com.jobsearchcv.backend: ${LOG_LEVEL:INFO}
    # Third-party libraries - keep quiet in production
    org.springframework: INFO
    org.mongodb.driver: WARN
    org.quartz: INFO
    org.zalando.logbook: WARN

DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:}
OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:}


# Resend Email Configuration
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}
  from-name: ${RESEND_FROM_NAME:ApplyFirst}

# X.com (Twitter) API Configuration
xcom:
  api-url: ${XCOM_API_URL}
  api-key: ${XCOM_API_KEY}

# Application URLs and contact information
app:
  website:
    url: ${WEBSITE_URL}
  support:
    email: ${SUPPORT_EMAIL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logbook configuration for request/response logging
# Most configuration is handled in LogbookConfig.kt
logbook:
  format:
    style: http
  minimum-status: 200 # Only log successful responses and above

# Springdoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  packages-to-scan: com.jobsearchcv.backend.controller
  paths-to-match: /api/**

# Stripe configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  customer-portal-url: ${STRIPE_CUSTOMER_PORTAL_URL}
  checkout-url: ${STRIPE_CHECKOUT_URL}  # Monthly plan ($14/month, 7-day trial)
  checkout-weekly-url: ${STRIPE_CHECKOUT_WEEKLY_URL}  # Weekly plan ($7/week, no trial)
  # Payment Link and Customer Portal URLs are configured in Stripe Dashboard
  # Frontend uses these directly:
  # - Monthly Payment Link: ${STRIPE_CHECKOUT_URL}?client_reference_id={userId}
  # - Weekly Payment Link: ${STRIPE_CHECKOUT_WEEKLY_URL}?client_reference_id={userId}
  # - Customer Portal: ${STRIPE_CUSTOMER_PORTAL_URL}

# Redis Streams Configuration
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}

  connection:
    timeout-ms: ${REDIS_CONNECTION_TIMEOUT_MS:5000}
    command-timeout-ms: ${REDIS_COMMAND_TIMEOUT_MS:10000}

  streams:
    enabled: ${ENABLE_REDIS_STREAMS:false}
    consumer-group: ${REDIS_CONSUMER_GROUP:backend-processors}
    request-stream: ${REDIS_REQUEST_STREAM:job-search:requests}
    result-stream: ${REDIS_RESULT_STREAM:job-search:results}
    dlq-stream: ${REDIS_DLQ_STREAM:job-search:dlq}

  producer:
    max-retry-attempts: ${REDIS_PRODUCER_MAX_RETRIES:3}
    retry-delay-ms: ${REDIS_PRODUCER_RETRY_DELAY_MS:1000}

  consumer:
    max-retries: ${REDIS_CONSUMER_MAX_RETRIES:3}
    claim-timeout-ms: ${REDIS_CONSUMER_CLAIM_TIMEOUT_MS:60000}
    claim-interval-ms: ${REDIS_CONSUMER_CLAIM_INTERVAL_MS:30000}

  fallback-to-http: ${FALLBACK_TO_HTTP:true}

---
# Local profile configuration
spring:
  config:
    activate:
      on-profile: local
    import: optional:file:.env.local[.properties]

---
# Production profile configuration
spring:
  config:
    activate:
      on-profile: prod
    import: optional:file:.env.prod[.properties]
