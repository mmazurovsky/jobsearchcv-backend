spring:
  config:
    activate:
      on-profile: prod,local
    import: optional:file:.env.local[.properties]
  application:
    name: jobsearchcv-backend
  data:
    mongodb:
      # Use the same MongoDB URI pattern that works in the other Spring app
      uri: mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}/${MONGO_DB}?tls=true&authSource=admin
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      use-big-decimal-for-floats: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
  mvc:
    async:
      request-timeout: 60000  # 60 seconds timeout for async requests


# Firebase configuration
firebase:
  enabled: ${FIREBASE_ENABLED:true}
  project-id: ${FIREBASE_PROJECT_ID:applyfirst-b9c69}
  credentials:
    # Option 1: Individual environment variables (recommended for deployment)
    private-key: ${FIREBASE_PRIVATE_KEY:}
    private-key-id: ${FIREBASE_PRIVATE_KEY_ID:}
    client-email: ${FIREBASE_CLIENT_EMAIL:}
    client-id: ${FIREBASE_CLIENT_ID:}
    # Option 2: File path (for local development)
    path: ${FIREBASE_CREDENTIALS_PATH:}
  storage:
    bucket: ${FIREBASE_STORAGE_BUCKET:applyfirst-b9c69.firebasestorage.app}
    retry:
      max-attempts: ${FIREBASE_STORAGE_MAX_RETRY_ATTEMPTS:3}
      delay-ms: ${FIREBASE_STORAGE_RETRY_DELAY_MS:1000}


sentry:
  dsn: ${SENTRY_DSN:}
  # Add data like request headers and IP for users,
  # see https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/ for more info
  send-default-pii: true
  # Set traces-sample-rate to 1.0 to capture 100% of transactions for tracing.
  # We recommend adjusting this value in production.
  traces-sample-rate: 1.0
  environment: ${SENTRY_ENVIRONMENT:development}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  config: classpath:logback-spring.xml
  level:
    root: ${LOG_LEVEL:INFO}
    com.jobsalerts: ${LOG_LEVEL:INFO}
    com.jobsearchcv.backend.http: ${LOG_LEVEL:INFO} # Custom HTTP logs
    # Logbook logging level - must be TRACE to see request/response logs
    org.zalando.logbook: TRACE
    # Enable to debug Logbook auto-configuration
    org.zalando.logbook.autoconfigure: DEBUG
    # Spring Security debug logging
    org.springframework.security: DEBUG
    com.jobsearchcv.backend.security: DEBUG

DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:}
OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:}

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:us-east-1}
    retry:
      max-attempts: ${AWS_S3_MAX_RETRY_ATTEMPTS:3}
      delay-ms: ${AWS_S3_RETRY_DELAY_MS:1000}
    bucket:
      cvs: ${AWS_S3_CVS_BUCKET:applyfirst-cvs}

# Resend Email Configuration
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL:noreply@jobsearchcv.com}
  from-name: ${RESEND_FROM_NAME:Job Search CV}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logbook configuration for request/response logging
# Most configuration is handled in LogbookConfig.kt
logbook:
  format:
    style: http
  minimum-status: 200 # Only log successful responses and above

# Springdoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  packages-to-scan: com.jobsearchcv.backend.controller
  paths-to-match: /api/**




