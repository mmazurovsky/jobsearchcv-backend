spring:
  config:
    activate:
      on-profile: test
    import: file:.env.local[.properties]
  application:
    name: jobsearchcv-backend-test
  data:
    mongodb:
      uri: ${MONGO_URL:mongodb://localhost:27017/jobs_alerts_test}
      database: jobs_alerts_test
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      use-big-decimal-for-floats: true

server:
  port: 0  # Random port for testing

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.jobsalerts: DEBUG
    org.springframework: WARN
    org.mongodb: WARN

# Firebase configuration for tests
firebase:
  project-id: test-firebase-project
  enabled: false

# Sentry configuration for tests
sentry:
  dsn: ""
  environment: test

# LLM configuration for tests
llm:
  api:
    key: test-key
    url: https://test.api.com
  model: test-model

DEEPSEEK_API_KEY: test-deepseek-key
OPENROUTER_API_KEY: test-openrouter-key


# CORS configuration for tests
cors:
  allowed-origins: http://localhost:3000

# Resend Email Configuration for tests  
resend:
  api-key: test-api-key
  from-email: test@example.com
  from-name: Test Name

# Scraper service configuration for tests
scraper:
  service-url: http://localhost:9999

# Environment variables for compatibility
SCRAPER_SERVICE_URL: http://localhost:9999
CALLBACK_URL: http://localhost:8080/api/scraper/callback