spring:
  config:
    activate:
      on-profile: test
    import: file:.env.local[.properties]
  application:
    name: jobsearchcv-backend-test
  data:
    mongodb:
      uri: ${MONGO_URL:mongodb://localhost:27017/jobs_alerts_test}
      database: jobs_alerts_test
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      use-big-decimal-for-floats: true

server:
  port: 0  # Random port for testing

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.jobsalerts: DEBUG
    org.springframework: WARN
    org.mongodb: WARN

# Supabase configuration for tests
supabase:
  url: https://test.supabase.co
  anon:
    key: test-key
  secret: test-jwt-secret-key-for-testing-purposes-only

# Sentry configuration for tests
sentry:
  dsn: ""
  environment: test

# LLM configuration for tests
llm:
  api:
    key: test-key
    url: https://test.api.com
  model: test-model

# AWS configuration for tests
aws:
  s3:
    access-key: test-access-key
    secret-key: test-secret-key
    region: us-east-1
    bucket:
      cvs: test-bucket

# CORS configuration for tests
cors:
  allowed-origins: http://localhost:3000