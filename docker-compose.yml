version: '3.8'

services:
  job-search-cv-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.digitalocean.com/mmazurovsky-registry/job-search-cv-backend
    container_name: jobs-alerts-job-search-cv-backend
    ports:
      - "8080:8080"
    env_file:
      - .env.${ENV}
    environment:
      - SPRING_PROFILES_ACTIVE=${ENV}
    volumes:
      - ./logs:/app/logs
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 